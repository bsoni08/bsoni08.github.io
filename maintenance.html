<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bhavesh Soni — Back soon.">
  <title>Bhavesh Soni — Back soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #080810;
      --surface: #0f0f1a;
      --border:  #1e1e35;
      --text:    #ede8de;
      --text-2:  #9a9488;
      --text-3:  #5e5a54;
      --accent:  #d4954a;
      --font:    'Inter', system-ui, sans-serif;
      --mono:    'JetBrains Mono', monospace;
    }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 24px;
      text-align: center;
    }

    /* Subtle animated dot */
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      margin: 0 auto 40px;
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: .3; transform: scale(1); box-shadow: 0 0 0 0 rgba(212,149,74,.4); }
      50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 0 8px rgba(212,149,74,0); }
    }

    .brand {
      font-family: var(--mono);
      font-size: .78rem;
      color: var(--text-3);
      letter-spacing: .06em;
      margin-bottom: 32px;
    }
    .brand span { color: var(--accent); }

    h1 {
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 500;
      letter-spacing: -.03em;
      line-height: 1.15;
      color: var(--text);
      margin-bottom: 16px;
    }

    .sub {
      font-size: .9rem;
      color: var(--text-2);
      line-height: 1.7;
      max-width: 360px;
      margin: 0 auto 48px;
    }

    .links {
      display: flex;
      gap: 20px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }
    .links a {
      font-family: var(--mono);
      font-size: .7rem;
      color: var(--text-3);
      text-decoration: none;
      letter-spacing: .04em;
      transition: color .2s ease;
    }
    .links a:hover { color: var(--accent); }
    .links .sep { color: var(--border); font-size: .7rem; }

    .footer-note {
      position: fixed;
      bottom: 24px;
      font-family: var(--mono);
      font-size: .62rem;
      color: var(--text-3);
      letter-spacing: .04em;
    }
  </style>
</head>
<body>

  <div class="dot"></div>

  <p class="brand">Bhavesh <span>Soni</span></p>

  <h1>Back soon.</h1>

  <p class="sub">
    The site is under maintenance.<br>
    Check back in a little while.
  </p>

  <nav class="links">
    <a href="https://github.com/bsoni08" target="_blank" rel="noopener">GitHub</a>
    <span class="sep">·</span>
    <a href="https://www.linkedin.com/in/bsoni08/" target="_blank" rel="noopener">LinkedIn</a>
  </nav>

  <p class="footer-note">bhaveshsoni.com</p>

</body>
</html>
